services : 

  redis : 
     image : redis:7
     container_name : redis-container
     ports : 
        - "6379:6379"
     command: ["redis-server" , "--appendonly" , "yes"]  
     volumes: 
        - redis-data:/data

  mongodb :
          image : mongo:7
          container_name : mongodb-container
          ports :
              - "27017:27017"

          environment : 
              MONGO_INITDB_DATABASE : my_redis_mongoDB
          volumes :
                 - mongo-data:/data/db

volumes : 
         redis-data : 
         mongo-data :     